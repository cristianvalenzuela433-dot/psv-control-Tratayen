                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Equipo Vinculado</p>
                                            <p className={`text-base font-medium mt-1 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>{selectedPSV.equipo || 'No especificado'}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Ubicación Física</p>
                                            <p className={`text-base font-medium mt-1 ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>{selectedPSV.ubicacion || 'No especificado'}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Set de Presión</p>
                                            <p className="text-xl font-black text-indigo-600 mt-1">{renderPresion(selectedPSV)}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Última Calibración</p>
                                            <p className={`text-base font-bold mt-1 ${darkMode ? 'text-gray-200' : 'text-gray-800'}`}>{formatearFecha(selectedPSV.fechaCalibracion)}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Próxima Calibración</p>
                                            <div className="flex items-center gap-2 mt-1">
                                                <p className="text-lg font-black text-blue-600">{getProximaFecha(selectedPSV.fechaCalibracion)}</p>
                                                <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${getVencimientoInfo(selectedPSV.fechaCalibracion).color}`}>
                                                    {getVencimientoInfo(selectedPSV.fechaCalibracion).label}
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bloque de Observaciones */}
                                    <div className={`mt-8 p-4 rounded-2xl ${darkMode ? 'bg-gray-700/50' : 'bg-gray-50'}`}>
                                        <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Observaciones de Campo</p>
                                        <p className={`mt-2 text-sm leading-relaxed ${darkMode ? 'text-gray-300' : 'text-gray-600 italic'}`}>
                                            {selectedPSV.observaciones || 'Sin observaciones registradas.'}
                                        </p>
                                    </div>

                                    {/* Footer del Modal */}
                                    <div className="mt-8 pt-6 border-t border-gray-100 flex justify-end">
                                        <button
                                            onClick={() => setShowDetailsModal(false)}
                                            className="px-8 py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition-all transform hover:scale-105 active:scale-95 shadow-lg"
                                        >
                                            Entendido
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
