            content: none !important;

<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBTn7lmufgLCUvX3h8v1ZoaBCPm_qIz3MA",
            authDomain: "psv-control-tratayen.firebaseapp.com",
            databaseURL: "https://psv-control-tratayen-default-rtdb.firebaseio.com",
            projectId: "psv-control-tratayen",
            storageBucket: "psv-control-tratayen.firebasestorage.app",
            messagingSenderId: "851186777433",
            appId: "1:851186777433:web:3ed301625fcfea0666a048"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        console.log('🔥 Firebase conectado');
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('currentUser');
                return saved ? JSON.parse(saved) : null;
            });
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [psvData, setPsvData] = useState([]);
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterArea, setFilterArea] = useState('all');
            const [filterEstado, setFilterEstado] = useState('all');
            const [selectedPSV, setSelectedPSV] = useState(null);
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });
            const [showAdminPanel, setShowAdminPanel] = useState(false);
            const [newUser, setNewUser] = useState({ username: '', password: '', nombre: '', role: 'operador', autorizado: false });
            const [editingUser, setEditingUser] = useState(null);
            const [showEditUser, setShowEditUser] = useState(false);
            const [showAddPSV, setShowAddPSV] = useState(false);
            const [newPSV, setNewPSV] = useState({
                area: '',
                tag: '',
                equipo: '',
                ubicacion: '',
                presionSet: '',
                unidadPresion: 'PSI',
                estado: 'Habilitada',
                observaciones: '',
                fechaCalibracion: ''
            });
            const [showEditPSV, setShowEditPSV] = useState(false);
            const [editingPSV, setEditingPSV] = useState(null);
            const [showDuplicatesModal, setShowDuplicatesModal] = useState(false);
            const [duplicates, setDuplicates] = useState([]);
            const [showDetailsModal, setShowDetailsModal] = useState(false);

            // Guardar usuario en localStorage cuando cambia
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('currentUser');
                }
            }, [currentUser]);

            // Guardar modo oscuro en localStorage
            useEffect(() => {
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
            }, [darkMode]);

            // Cargar datos de Firebase
            useEffect(() => {
                // Cargar PSVs
                const psvRef = database.ref('psvs');
                psvRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const psvArray = Object.entries(data).map(([id, psv]) => ({
                            id,
                            ...psv
                        }));
                        setPsvData(psvArray);
                    }
                    setLoading(false);
                });

                // Cargar usuarios
                const usersRef = database.ref('users');
                usersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const usersArray = Object.entries(data).map(([id, user]) => ({
                            id,
                            ...user
                        }));
                        setUsers(usersArray);
                    } else {
                        // Crear usuario admin por defecto
                        const defaultAdmin = {
                            username: 'admin',
                            password: 'admin123',
                            nombre: 'Jefe de Turno',
                            role: 'admin',
                            autorizado: true
                        };
                        database.ref('users').push(defaultAdmin);
                    }
                });

                return () => {
                    psvRef.off();
                    usersRef.off();
                };
            }, []);

            // Login
            const handleLogin = () => {
                if (loginForm.username === 'admin' && loginForm.password === 'admin123') {
                    setCurrentUser({
                        username: 'admin',
                        nombre: 'Jefe de Turno',
                        role: 'admin',
                        autorizado: true
                    });
                    return;
                }

                const user = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
                if (user) {
                    setCurrentUser(user);
                } else {
                    alert('Usuario o contraseña incorrectos');
                }
            };

            // Agregar nuevo usuario (solo admin)
            const handleAddUser = () => {
                if (!newUser.username || !newUser.password || !newUser.nombre) {
                    alert('Complete todos los campos');
                    return;
                }
                database.ref('users').push(newUser);
                setNewUser({ username: '', password: '', nombre: '', role: 'operador', autorizado: false });
                alert('Usuario creado exitosamente');
            };

            // Cambiar autorización de usuario
            const toggleAutorizacion = (userId, currentStatus) => {
                database.ref('users/' + userId).update({ autorizado: !currentStatus });
            };

            // Eliminar usuario
            const deleteUser = (userId) => {
                if (window.confirm('¿Está seguro de eliminar este usuario?')) {
                    database.ref('users/' + userId).remove();
                }
            };

            // Abrir modal para editar usuario
            const openEditUser = (user) => {
                setEditingUser({ ...user });
                setShowEditUser(true);
            };

            // Guardar cambios de usuario editado
            const handleUpdateUser = () => {
                if (!editingUser.username || !editingUser.password || !editingUser.nombre) {
                    alert('Complete todos los campos obligatorios');
                    return;
                }

                const updates = {
                    username: editingUser.username,
                    password: editingUser.password,
                    role: editingUser.role,
                    autorizado: editingUser.autorizado
                };

                database.ref('users/' + editingUser.id).update(updates)
                    .then(() => {
                        setShowEditUser(false);
                        setEditingUser(null);
                        alert('Usuario actualizado exitosamente');
                    })
                    .catch((error) => {
                        alert('Error al actualizar: ' + error.message);
                    });
            };

            // Buscar PSV duplicadas
            const findDuplicates = () => {
                const tagCount = {};
                const duplicateList = [];

                psvData.forEach(psv => {
                    const tag = psv.tag?.trim().toLowerCase();
                    if (tag) {
                        if (!tagCount[tag]) {
                            tagCount[tag] = [];
                        }
                        tagCount[tag].push(psv);
                    }
                });

                Object.entries(tagCount).forEach(([tag, psvList]) => {
                    if (psvList.length > 1) {
                        duplicateList.push({
                            tag: psvList[0].tag,
                            count: psvList.length,
                            items: psvList
                        });
                    }
                });

                setDuplicates(duplicateList);
                setShowDuplicatesModal(true);

                if (duplicateList.length === 0) {
                    alert('✅ No se encontraron PSV duplicadas');
                }
            };

            // Agregar nueva PSV
            const handleAddPSV = () => {
                if (!newPSV.tag || !newPSV.area) {
                    alert('El TAG y el Área son obligatorios');
                    return;
                }
                database.ref('psvs').push(newPSV);
                setNewPSV({
                    area: '',
                    tag: '',
                    equipo: '',
                    ubicacion: '',
                    presionSet: '',
                    unidadPresion: 'PSI',
                    estado: 'Habilitada',
                    observaciones: '',
                    fechaCalibracion: ''
                });
                setShowAddPSV(false);
                alert('PSV agregada exitosamente');
            };

            // Eliminar PSV
            const handleDeletePSV = (psvId, psvTag) => {
                if (!currentUser.autorizado && currentUser.role !== 'admin') {
                    alert('No tienes autorización para eliminar PSV');
                    return;
                }
                if (window.confirm(`¿Está seguro de eliminar la PSV ${psvTag}?`)) {
                    database.ref('psvs/' + psvId).remove();
                    alert('PSV eliminada exitosamente');
                }
            };
            // Abrir modal de edición
            const openEditPSV = (psv) => {
                setEditingPSV({ ...psv });
                setShowEditPSV(true);
            };

            // Guardar cambios de PSV editada
            const handleUpdatePSV = () => {
                if (!editingPSV.tag || !editingPSV.area) {
                    alert('El TAG y el Área son obligatorios');
                    return;
                }

                const updates = {
                    area: editingPSV.area,
                    tag: editingPSV.tag,
                    equipo: editingPSV.equipo || '',
                    ubicacion: editingPSV.ubicacion || '',
                    presionSet: editingPSV.presionSet || '',
                    unidadPresion: editingPSV.unidadPresion || 'PSI',
                    estado: editingPSV.estado,
                    observaciones: editingPSV.observaciones || '',
                    fechaCalibracion: editingPSV.fechaCalibracion || ''
                };

                database.ref('psvs/' + editingPSV.id).update(updates)
                    .then(() => {
                        setShowEditPSV(false);
                        setEditingPSV(null);
                        alert('PSV actualizada exitosamente');
                    })
                    .catch((error) => {
                        alert('Error al actualizar: ' + error.message);
                    });
            };

            // Lógica de Vencimiento
            const getVencimientoInfo = (fechaCalibracion) => {
                if (!fechaCalibracion) return { color: '', label: 'S/D', days: 999, blink: false };

                // Hoy a medianoche local
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);

                // Parsear fecha de calibración manualmente (YYYY-MM-DD) para evitar desfases UTC
                const [year, month, day] = fechaCalibracion.split('-').map(Number);

                // El vencimiento es exactamente 1 año después
                const vencimiento = new Date(year + 1, month - 1, day);
                vencimiento.setHours(0, 0, 0, 0);

                const diffTime = vencimiento - hoy;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays < 0) {
                    const absDays = Math.abs(diffDays);
                    return {
                        color: 'bg-red-600 text-white',
                        label: `${absDays} ${absDays === 1 ? 'día vencida' : 'días vencida'}`,
                        days: diffDays,
                        blink: true
                    };
                }

                if (diffDays === 0) {
                    return { color: 'bg-red-600 text-white', label: 'VENCE HOY', days: 0, blink: true };
                }

                if (diffDays <= 3) return { color: 'bg-red-500 text-white font-bold', label: diffDays + (diffDays === 1 ? ' día' : ' días'), days: diffDays, blink: false };
                if (diffDays <= 10) return { color: 'bg-yellow-400 text-gray-900 font-bold', label: diffDays + ' días', days: diffDays, blink: false };

                return { color: 'bg-green-100 text-green-800', label: diffDays + ' días', days: diffDays, blink: false };
            };

            // Formatear fecha para visualización (DD-MM-YY)
            const formatearFecha = (fechaStr) => {
                if (!fechaStr) return 'S/D';
                const [year, month, day] = fechaStr.split('-');
                return `${day}-${month}-${year.slice(-2)}`;
            };

            // Calcular próxima calibración (+1 año)
            const getProximaFecha = (fechaStr) => {
                if (!fechaStr) return 'S/D';
                const [year, month, day] = fechaStr.split('-').map(Number);
                // Calculamos la fecha sumando 1 año
                const d = String(day).padStart(2, '0');
                const m = String(month).padStart(2, '0');
                const y = String(year + 1); // Mostramos el año completo o corto, usemos DD-MM-YYYY para claridad
                return `${d}-${m}-${y}`;
            };

            // Renderizar presión sin duplicar unidades
            const renderPresion = (psv) => {
                if (!psv.presionSet) return '---';
                const set = String(psv.presionSet).toLowerCase();
                // Si el texto ya tiene la unidad escrita, lo devolvemos tal cual
                if (set.includes('psi') || set.includes('bar') || set.includes('kg/cm')) {
                    return psv.presionSet;
                }
                // Si no tiene unidad, le pegamos la que tenga seleccionada (o PSI por defecto)
                return `${psv.presionSet} ${psv.unidadPresion || 'PSI'}`;
            };

            // Filtrar PSV
            const filteredPSVs = useMemo(() => {
                return psvData.filter(psv => {
                    const matchSearch = psv.tag?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        psv.equipo?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        psv.ubicacion?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        psv.area?.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchArea = filterArea === 'all' || psv.area === filterArea;

                    let matchEstado = true;
                    if (filterEstado !== 'all') {
                        if (filterEstado === 'Vencida') {
                            const info = getVencimientoInfo(psv.fechaCalibracion);
                            matchEstado = info.days <= 0;
                        } else {
                            matchEstado = psv.estado === filterEstado;
                        }
                    }

                    return matchSearch && matchArea && matchEstado;
                });
            }, [psvData, searchTerm, filterArea, filterEstado]);

            // Obtener áreas únicas
            const areas = [...new Set(psvData.map(psv => psv.area))].sort();

            // Estadísticas para botones
            const stats = useMemo(() => {
                const total = psvData.length;
                const habilitadas = psvData.filter(p => p.estado === 'Habilitada').length;
                const bloqueadas = psvData.filter(p => p.estado === 'Bloqueada').length;
                const retiradas = psvData.filter(p => p.estado === 'Retirada').length;
                const vencidas = psvData.filter(p => getVencimientoInfo(p.fechaCalibracion).days <= 0).length;
                return { total, habilitadas, bloqueadas, retiradas, vencidas };
            }, [psvData]);

            // Cambiar estado de PSV
            const cambiarEstado = (psvId, nuevoEstado) => {
                if (!currentUser.autorizado && currentUser.role !== 'admin') {
                    alert('No tienes autorización para realizar cambios');
                    return;
                }
                if (window.confirm(`¿Cambiar estado a ${nuevoEstado}?`)) {
                    database.ref('psvs/' + psvId).update({ estado: nuevoEstado });
                }
            };

            const actualizarObservaciones = (psvId, observaciones) => {
                if (!currentUser.autorizado && currentUser.role !== 'admin') {
                    alert('No tienes autorización para realizar cambios');
                    return;
                }
                database.ref('psvs/' + psvId).update({ observaciones });
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <div className="flex justify-center mb-6">
                                <div className="bg-blue-600 p-4 rounded-full">
                                    <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                </div>
                            </div>
                            <h1 className="text-3xl font-bold text-slate-800 text-center">Control PSV</h1>
                            <p className="text-slate-600 mt-2 text-center">Planta Tratayén</p>
                            <p className="text-green-600 text-sm mt-2 text-center">🟢 Conectado - {psvData.length} PSV</p>

                            <div className="space-y-4 mt-6">
                                <input
                                    type="text"
                                    value={loginForm.username}
                                    onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                    className="w-full px-4 py-3 border rounded-lg"
                                    placeholder="Usuario"
                                />
                                <input
                                    type="password"
                                    value={loginForm.password}
                                    onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                    className="w-full px-4 py-3 border rounded-lg"
                                    placeholder="Contraseña"
                                />
                                <button onClick={handleLogin} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                                    Iniciar Sesión
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`}>
                    {/* Header */}
                    <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} shadow-lg p-4 sticky top-0 z-10`}>
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className={`text-2xl font-bold ${darkMode ? 'text-white' : 'text-slate-800'}`}>Control PSV - Planta Tratayén</h1>
                                <p className={`${darkMode ? 'text-gray-300' : 'text-slate-600'}`}>Bienvenido, {currentUser.nombre}</p>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                {currentUser.role === 'admin' && (
                                    <button
                                        onClick={() => setShowAdminPanel(!showAdminPanel)}
                                        className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 ${showAdminPanel
                                            ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30'
                                            : (darkMode ? 'bg-purple-900/30 text-purple-400 border border-purple-500/30 hover:bg-purple-600 hover:text-white' : 'bg-purple-50 text-purple-700 hover:bg-purple-600 hover:text-white border border-purple-200')
                                            }`}
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                        <span className="hidden md:inline">Gestión de Usuarios</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 ${darkMode
                                        ? 'bg-amber-100 text-amber-700 shadow-lg shadow-amber-500/20'
                                        : 'bg-slate-800 text-white shadow-lg shadow-slate-900/20 border border-slate-700'
                                        }`}
                                >
                                    {darkMode ? (
                                        <>
                                            <svg className="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" /></svg>
                                            <span className="hidden md:inline text-amber-700">Modo Día</span>
                                        </>
                                    ) : (
                                        <>
                                            <svg className="w-5 h-5 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
                                            <span className="hidden md:inline">Modo Noche</span>
                                        </>
                                    )}
                                </button>

                                <button
                                    onClick={() => setCurrentUser(null)}
                                    className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 ${darkMode
                                        ? 'bg-rose-900/30 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white'
                                        : 'bg-white text-rose-600 border border-rose-100 hover:bg-rose-600 hover:text-white shadow-sm'
                                        }`}
                                >
                                    <svg className="w-5 h-5 text-rose-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                    <span className="hidden md:inline">Salir</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Panel de Gestión de Usuarios (solo admin) */}
                    {showAdminPanel && currentUser.role === 'admin' && (
                        <div className="max-w-7xl mx-auto p-6">
                            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg shadow p-6 mb-6`}>
                                <h2 className={`text-2xl font-bold mb-4 ${darkMode ? 'text-white' : 'text-gray-900'}`}>Gestión de Usuarios</h2>

                                {/* Crear nuevo usuario */}
                                <div className="mb-6 p-4 border rounded-lg">
                                    <h3 className={`text-lg font-semibold mb-3 ${darkMode ? 'text-white' : 'text-gray-900'}`}>Crear Nuevo Usuario</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                        <input
                                            type="text"
                                            placeholder="Usuario"
                                            value={newUser.username}
                                            onChange={(e) => setNewUser({ ...newUser, username: e.target.value })}
                                            className={`px-3 py-2 border rounded ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                        <input
                                            type="text"
                                            placeholder="Contraseña"
                                            value={newUser.password}
                                            onChange={(e) => setNewUser({ ...newUser, password: e.target.value })}
                                            className={`px-3 py-2 border rounded ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                        <input
                                            type="text"
                                            placeholder="Nombre completo"
                                            value={newUser.nombre}
                                            onChange={(e) => setNewUser({ ...newUser, nombre: e.target.value })}
                                            className={`px-3 py-2 border rounded ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                        <button
                                            onClick={handleAddUser}
                                            className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                                        >
                                            ➕ Crear Usuario
                                        </button>
                                    </div>
                                </div>

                                {/* Lista de usuarios */}
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className={darkMode ? 'bg-gray-700' : 'bg-gray-100'}>
                                            <tr>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Usuario</th>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Nombre</th>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Contraseña</th>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Rol</th>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Autorización</th>
                                                <th className={`px-4 py-3 text-left ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {users.map((user) => (
                                                <tr key={user.id} className={`border-b ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                                                    <td className={`px-4 py-3 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{user.username}</td>
                                                    <td className={`px-4 py-3 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{user.nombre}</td>
                                                    <td className={`px-4 py-3`}>
                                                        <span className={`px-2 py-1 rounded text-sm ${user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}`}>
                                                            {user.role === 'admin' ? 'Administrador' : 'Operador'}
                                                        </span>
                                                    </td>
                                                    <td className={`px-4 py-3 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>
                                                        <span className="font-mono">{user.password}</span>
                                                    </td>
                                                    <td className={`px-4 py-3`}>
                                                        {user.role !== 'admin' && (
                                                            <button
                                                                onClick={() => toggleAutorizacion(user.id, user.autorizado)}
                                                                className={`px-3 py-1 rounded text-sm font-semibold ${user.autorizado
                                                                    ? 'bg-green-100 text-green-800'
                                                                    : 'bg-red-100 text-red-800'
                                                                    }`}
                                                            >
                                                                {user.autorizado ? '✓ Autorizado' : '✗ Sin Autorización'}
                                                            </button>
                                                        )}
                                                    </td>
                                                    <td className={`px-4 py-3`}>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => openEditUser(user)} className="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">✏️</button>
                                                            {user.role !== 'admin' && <button onClick={() => deleteUser(user.id)} className="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700">🗑️</button>}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Filtros y búsqueda */}
                    <div className="max-w-7xl mx-auto p-6">
                        {/* Botones superiores */}
                        {(currentUser.role === 'admin' || currentUser.autorizado) && (
                            <div className="mb-4 flex gap-3">
                                <button
                                    onClick={() => setShowAddPSV(!showAddPSV)}
                                    className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold"
                                >
                                    ➕ Agregar Nueva PSV
                                </button>
                                <button
                                    onClick={findDuplicates}
                                    className="px-6 py-3 bg-orange-600 text-white rounded-lg hover:bg-orange-700 font-semibold"
                                >
                                    🔍 Buscar Duplicados
                                </button>
                            </div>
                        )}

                        {/* Formulario para agregar PSV */}
                        {showAddPSV && (
                            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg shadow p-6 mb-6`}>
                                <h3 className={`text-xl font-bold mb-4 ${darkMode ? 'text-white' : 'text-gray-900'}`}>Nueva PSV</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Área</label>
                                        <select
                                            value={newPSV.area}
                                            onChange={(e) => setNewPSV({ ...newPSV, area: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        >
                                            <option value="">Seleccionar Área *</option>
                                            {areas.map(area => (
                                                <option key={area} value={area}>{area}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>TAG</label>
                                        <input
                                            type="text"
                                            placeholder="TAG *"
                                            value={newPSV.tag}
                                            onChange={(e) => setNewPSV({ ...newPSV, tag: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Equipo</label>
                                        <input
                                            type="text"
                                            placeholder="Equipo"
                                            value={newPSV.equipo}
                                            onChange={(e) => setNewPSV({ ...newPSV, equipo: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Ubicación</label>
                                        <input
                                            type="text"
                                            placeholder="Ubicación"
                                            value={newPSV.ubicacion}
                                            onChange={(e) => setNewPSV({ ...newPSV, ubicacion: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Set de Presión</label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                placeholder="Valor"
                                                value={newPSV.presionSet}
                                                onChange={(e) => setNewPSV({ ...newPSV, presionSet: e.target.value })}
                                                className={`flex-1 px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                            />
                                            <select
                                                value={newPSV.unidadPresion}
                                                onChange={(e) => {
                                                    const nuevaUnidad = e.target.value;
                                                    // Limpieza automática: Si el valor ya tiene unidades escritas, las quitamos
                                                    let valorLimpio = String(newPSV.presionSet)
                                                        .replace(/psi/gi, '')
                                                        .replace(/bar/gi, '')
                                                        .replace(/kg\/cm2/gi, '')
                                                        .replace(/kg\/cm²/gi, '')
                                                        .trim();
                                                    setNewPSV({ ...newPSV, unidadPresion: nuevaUnidad, presionSet: valorLimpio });
                                                }}
                                                className={`w-24 px-2 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                            >
                                                <option value="PSI">PSI</option>
                                                <option value="Bar">Bar</option>
                                                <option value="Kg/cm²">Kg/cm²</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Fecha Calibración</label>
                                        <input
                                            type="date"
                                            value={newPSV.fechaCalibracion}
                                            onChange={(e) => setNewPSV({ ...newPSV, fechaCalibracion: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg w-full ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        />
                                        {newPSV.fechaCalibracion && (
                                            <p className="text-[10px] text-blue-500 font-bold">
                                                Vence: {getProximaFecha(newPSV.fechaCalibracion)}
                                            </p>
                                        )}
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Estado</label>
                                        <select
                                            value={newPSV.estado}
                                            onChange={(e) => setNewPSV({ ...newPSV, estado: e.target.value })}
                                            className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white'}`}
                                        >
                                            <option value="Habilitada">Habilitada</option>
                                            <option value="Bloqueada">Bloqueada</option>
                                            <option value="Retirada">Retirada</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="mt-4 flex gap-3">
                                    <button onClick={handleAddPSV} className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">✓ Guardar PSV</button>
                                    <button onClick={() => setShowAddPSV(false)} className="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">✗ Cancelar</button>
                                </div>
                            </div>
                        )}

                        <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg shadow p-4 mb-6`}>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input
                                    type="text"
                                    placeholder="Buscar por TAG, Equipo, Ubicación o Área..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white text-gray-900'}`}
                                />
                                <select
                                    value={filterArea}
                                    onChange={(e) => setFilterArea(e.target.value)}
                                    className={`px-4 py-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white text-gray-900'}`}
                                >
                                    <option value="all">Todas las áreas</option>
                                    {areas.map(area => (
                                        <option key={area} value={area}>{area}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        {/* Estadísticas (Botones de Filtro Modernizados) */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                            {/* Total PSV */}
                            <button
                                onClick={() => setFilterEstado('all')}
                                className={`relative group overflow-hidden rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl ${filterEstado === 'all'
                                    ? (darkMode ? 'bg-blue-600/20 ring-2 ring-blue-500 shadow-blue-500/20' : 'bg-blue-50 ring-2 ring-blue-500 shadow-blue-500/10')
                                    : (darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100')
                                    }`}
                            >
                                <div className="p-5 flex items-center gap-4">
                                    <div className={`p-3 rounded-xl transition-colors ${filterEstado === 'all' ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-600'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                                    </div>
                                    <div className="text-left">
                                        <h3 className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Total PSV</h3>
                                        <p className={`text-2xl font-black ${darkMode ? 'text-white' : 'text-gray-900'}`}>{stats.total}</p>
                                    </div>
                                </div>
                                {filterEstado === 'all' && <div className="absolute bottom-0 left-0 w-full h-1 bg-blue-600"></div>}
                            </button>

                            {/* Habilitadas */}
                            <button
                                onClick={() => setFilterEstado('Habilitada')}
                                className={`relative group overflow-hidden rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl ${filterEstado === 'Habilitada'
                                    ? (darkMode ? 'bg-green-600/20 ring-2 ring-green-500 shadow-green-500/20' : 'bg-green-50 ring-2 ring-green-500 shadow-green-500/10')
                                    : (darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100')
                                    }`}
                            >
                                <div className="p-5 flex items-center gap-4">
                                    <div className={`p-3 rounded-xl transition-colors ${filterEstado === 'Habilitada' ? 'bg-green-600 text-white' : 'bg-green-100 text-green-600'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                    </div>
                                    <div className="text-left">
                                        <h3 className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Habilitadas</h3>
                                        <p className={`text-2xl font-black ${darkMode ? 'text-white' : 'text-gray-900'}`}>{stats.habilitadas}</p>
                                    </div>
                                </div>
                                {filterEstado === 'Habilitada' && <div className="absolute bottom-0 left-0 w-full h-1 bg-green-600"></div>}
                            </button>

                            {/* Bloqueadas */}
                            <button
                                onClick={() => setFilterEstado('Bloqueada')}
                                className={`relative group overflow-hidden rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl ${filterEstado === 'Bloqueada'
                                    ? (darkMode ? 'bg-red-600/20 ring-2 ring-red-500 shadow-red-500/20' : 'bg-red-50 ring-2 ring-red-500 shadow-red-500/10')
                                    : (darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100')
                                    }`}
                            >
                                <div className="p-5 flex items-center gap-4">
                                    <div className={`p-3 rounded-xl transition-colors ${filterEstado === 'Bloqueada' ? 'bg-red-600 text-white' : 'bg-red-100 text-red-600'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                    </div>
                                    <div className="text-left">
                                        <h3 className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Bloqueadas</h3>
                                        <p className={`text-2xl font-black ${darkMode ? 'text-white' : 'text-gray-900'}`}>{stats.bloqueadas}</p>
                                    </div>
                                </div>
                                {filterEstado === 'Bloqueada' && <div className="absolute bottom-0 left-0 w-full h-1 bg-red-600"></div>}
                            </button>

                            {/* Retiradas */}
                            <button
                                onClick={() => setFilterEstado('Retirada')}
                                className={`relative group overflow-hidden rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl ${filterEstado === 'Retirada'
                                    ? (darkMode ? 'bg-amber-600/20 ring-2 ring-amber-500 shadow-amber-500/20' : 'bg-amber-50 ring-2 ring-amber-500 shadow-amber-500/10')
                                    : (darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100')
                                    }`}
                            >
                                <div className="p-5 flex items-center gap-4">
                                    <div className={`p-3 rounded-xl transition-colors ${filterEstado === 'Retirada' ? 'bg-amber-600 text-white' : 'bg-amber-100 text-amber-600'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </div>
                                    <div className="text-left">
                                        <h3 className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Retiradas</h3>
                                        <p className={`text-2xl font-black ${darkMode ? 'text-white' : 'text-gray-900'}`}>{stats.retiradas}</p>
                                    </div>
                                </div>
                                {filterEstado === 'Retirada' && <div className="absolute bottom-0 left-0 w-full h-1 bg-amber-600"></div>}
                            </button>

                            {/* Vencidas */}
                            <button
                                onClick={() => setFilterEstado('Vencida')}
                                className={`relative group overflow-hidden rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl ${filterEstado === 'Vencida'
                                    ? (darkMode ? 'bg-rose-900/40 ring-2 ring-rose-500 shadow-rose-500/20' : 'bg-rose-50 ring-2 ring-rose-500 shadow-rose-500/10')
                                    : (darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100')
                                    }`}
                            >
                                <div className="p-5 flex items-center gap-4">
                                    <div className={`p-3 rounded-xl transition-colors ${filterEstado === 'Vencida' ? 'bg-rose-600 text-white animate-pulse' : 'bg-rose-100 text-rose-600'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                    </div>
                                    <div className="text-left">
                                        <h3 className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Vencidas</h3>
                                        <p className={`text-2xl font-black ${darkMode ? 'text-rose-600' : 'text-rose-700'}`}>{stats.vencidas}</p>
                                    </div>
                                </div>
                                {filterEstado === 'Vencida' && <div className="absolute bottom-0 left-0 w-full h-1 bg-rose-600"></div>}
                            </button>
                        </div>

                        {/* Tabla de PSV */}
                        <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg shadow overflow-hidden`}>
                            <div className="overflow-x-auto">
                                <table className="w-full table-auto">
                                    <thead className={darkMode ? 'bg-gray-700' : 'bg-gray-100'}>
                                        <tr>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-24 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Área</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-40 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>TAG</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-40 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Equipo</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-40 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Ubicación</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-28 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Set Presión</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-24 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Última Calib.</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-24 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Vencimiento</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-28 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Estado</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-36 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Próximo a Vencer</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Observaciones</th>
                                            <th className={`px-3 py-3 text-left text-xs font-semibold w-20 ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredPSVs.map((psv) => {
                                            const info = getVencimientoInfo(psv.fechaCalibracion);
                                            return (
                                                <tr key={psv.id}
                                                    onClick={() => { setSelectedPSV(psv); setShowDetailsModal(true); }}
                                                    className={`border-b cursor-pointer transition-colors ${darkMode ? 'border-gray-700 hover:bg-gray-700/50' : 'border-gray-200 hover:bg-blue-50/50'}`}>
                                                    <td className={`px-3 py-2 text-xs ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{psv.area}</td>
                                                    <td className={`px-3 py-2 font-mono text-xs font-bold whitespace-nowrap ${darkMode ? 'text-blue-400' : 'text-blue-600 underline'}`}>{psv.tag}</td>
                                                    <td className={`px-3 py-2 text-xs ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{psv.equipo}</td>
                                                    <td className={`px-3 py-2 text-xs ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{psv.ubicacion}</td>
                                                    <td className={`px-3 py-2 text-xs ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{renderPresion(psv)}</td>
                                                    <td className={`px-3 py-2 text-xs whitespace-nowrap ${darkMode ? 'text-gray-300' : 'text-gray-900'}`}>{formatearFecha(psv.fechaCalibracion)}</td>
                                                    <td className={`px-3 py-2 text-xs whitespace-nowrap font-bold ${darkMode ? 'text-blue-400' : 'text-blue-700'}`}>{getProximaFecha(psv.fechaCalibracion)}</td>
                                                    <td className="px-3 py-2">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-semibold ${psv.estado === 'Habilitada' ? 'bg-green-100 text-green-800' :
                                                            psv.estado === 'Bloqueada' ? 'bg-red-100 text-red-800' :
                                                                'bg-yellow-100 text-yellow-800'
                                                            }`}>
                                                            {psv.estado}
                                                        </span>
                                                    </td>
                                                    <td className={`px-3 py-2 text-xs`}>
                                                        <span className={`px-2 py-1 rounded font-bold whitespace-nowrap inline-block ${info.color} ${info.blink ? 'animate-blink' : ''}`}>
                                                            {info.label}
                                                        </span>
                                                    </td>
                                                    <td className="px-3 py-2" onClick={(e) => e.stopPropagation()}>
                                                        <input
                                                            type="text"
                                                            value={psv.observaciones || ''}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                // Actualización inmediata local para el input
                                                                const newData = psvData.map(p => p.id === psv.id ? { ...p, observaciones: val } : p);
                                                                setPsvData(newData);
                                                            }}
                                                            onBlur={(e) => {
                                                                actualizarObservaciones(psv.id, e.target.value);
                                                            }}
                                                            disabled={!currentUser.autorizado && currentUser.role !== 'admin'}
                                                            className={`w-full min-w-[150px] px-2 py-1 text-xs border rounded ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white text-gray-900'
                                                                } ${(!currentUser.autorizado && currentUser.role !== 'admin') ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                        />
                                                    </td>
                                                    <td className="px-3 py-2" onClick={(e) => e.stopPropagation()}>
                                                        <div className="flex gap-1">
                                                            {(currentUser.role === 'admin' || currentUser.autorizado) && (
                                                                <>
                                                                    <button onClick={() => openEditPSV(psv)} className="px-2 py-1 bg-blue-600 text-white rounded text-xs" title="Editar">✏️</button>
                                                                    <button onClick={() => handleDeletePSV(psv.id, psv.tag)} className="px-2 py-1 bg-red-600 text-white rounded text-xs" title="Eliminar">🗑️</button>
                                                                </>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Modales */}
                    {showDuplicatesModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg shadow-2xl p-6 max-w-4xl w-full max-h-[90vh] overflow-y-auto`}>
                                <h2 className={`text-2xl font-bold mb-6 ${darkMode ? 'text-white' : 'text-gray-900'}`}>🔍 PSV Duplicadas</h2>
                                <div className="space-y-4">
                                    {duplicates.map((dup, idx) => (
                                        <div key={idx} className={`p-4 border rounded-lg ${darkMode ? 'border-gray-600 bg-gray-700' : 'border-gray-300 bg-gray-50'}`}>
                                            <h3 className="font-bold text-orange-600">TAG: {dup.tag}</h3>
                                            {dup.items.map(item => <p key={item.id} className="text-sm">Área: {item.area} | Estado: {item.estado}</p>)}
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 flex justify-end">
                                    <button onClick={() => setShowDuplicatesModal(false)} className="px-6 py-2 bg-gray-500 text-white rounded-lg">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditUser && editingUser && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-6 max-w-md w-full`}>
                                <h2 className="text-2xl font-bold mb-4">Editar Usuario</h2>
                                <input type="text" value={editingUser.username} onChange={e => setEditingUser({ ...editingUser, username: e.target.value })} className="w-full mb-3 p-2 border rounded" />
                                <input type="text" value={editingUser.nombre} onChange={e => setEditingUser({ ...editingUser, nombre: e.target.value })} className="w-full mb-3 p-2 border rounded" />
                                <select value={editingUser.role} onChange={e => setEditingUser({ ...editingUser, role: e.target.value })} className="w-full mb-3 p-2 border rounded">
                                    <option value="operador">Operador</option>
                                    <option value="admin">Administrador</option>
                                </select>
                                <label className="flex items-center gap-2 mb-4">
                                    <input type="checkbox" checked={editingUser.autorizado} onChange={e => setEditingUser({ ...editingUser, autorizado: e.target.checked })} /> Autorizado
                                </label>
                                <div className="flex gap-2">
                                    <button onClick={handleUpdateUser} className="flex-1 bg-blue-600 text-white py-2 rounded">Guardar</button>
                                    <button onClick={() => setShowEditUser(false)} className="flex-1 bg-gray-500 text-white py-2 rounded">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditPSV && editingPSV && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-6 max-w-2xl w-full`}>
                                <h2 className="text-2xl font-bold mb-4">Editar PSV: {editingPSV.tag}</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Área</label>
                                        <input type="text" value={editingPSV.area} onChange={e => setEditingPSV({ ...editingPSV, area: e.target.value })} className="p-2 border rounded" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>TAG</label>
                                        <input type="text" value={editingPSV.tag} onChange={e => setEditingPSV({ ...editingPSV, tag: e.target.value })} className="p-2 border rounded" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Equipo</label>
                                        <input type="text" value={editingPSV.equipo} onChange={e => setEditingPSV({ ...editingPSV, equipo: e.target.value })} className="p-2 border rounded" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Ubicación</label>
                                        <input type="text" value={editingPSV.ubicacion} onChange={e => setEditingPSV({ ...editingPSV, ubicacion: e.target.value })} className="p-2 border rounded" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Set de Presión</label>
                                        <div className="flex gap-2">
                                            <input type="text" value={editingPSV.presionSet} onChange={e => setEditingPSV({ ...editingPSV, presionSet: e.target.value })} className="flex-1 p-2 border rounded" />
                                            <select
                                                value={editingPSV.unidadPresion || 'PSI'}
                                                onChange={e => {
                                                    const nuevaUnidad = e.target.value;
                                                    // Limpieza automática para quitar unidades del campo de texto
                                                    let valorLimpio = String(editingPSV.presionSet)
                                                        .replace(/psi/gi, '')
                                                        .replace(/bar/gi, '')
                                                        .replace(/kg\/cm2/gi, '')
                                                        .replace(/kg\/cm²/gi, '')
                                                        .trim();
                                                    setEditingPSV({ ...editingPSV, unidadPresion: nuevaUnidad, presionSet: valorLimpio });
                                                }}
                                                className="w-24 p-2 border rounded"
                                            >
                                                <option value="PSI">PSI</option>
                                                <option value="Bar">Bar</option>
                                                <option value="Kg/cm²">Kg/cm²</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Fecha Calibración</label>
                                        <input type="date" value={editingPSV.fechaCalibracion || ''} onChange={e => setEditingPSV({ ...editingPSV, fechaCalibracion: e.target.value })} className="p-2 border rounded" />
                                        {editingPSV.fechaCalibracion && (
                                            <p className="text-[10px] text-blue-500 font-bold">
                                                Vence: {getProximaFecha(editingPSV.fechaCalibracion)}
                                            </p>
                                        )}
                                    </div>
                                    <div className="flex flex-col gap-1 col-span-2">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Estado</label>
                                        <select value={editingPSV.estado} onChange={e => setEditingPSV({ ...editingPSV, estado: e.target.value })} className="p-2 border rounded w-full">
                                            <option value="Habilitada">Habilitada</option>
                                            <option value="Bloqueada">Bloqueada</option>
                                            <option value="Retirada">Retirada</option>
                                        </select>
                                    </div>
                                    <div className="flex flex-col gap-1 col-span-2">
                                        <label className={`text-xs font-bold uppercase ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Observaciones</label>
                                        <textarea
                                            placeholder="Observaciones de la válvula"
                                            value={editingPSV.observaciones || ''}
                                            onChange={e => setEditingPSV({ ...editingPSV, observaciones: e.target.value })}
                                            className="p-2 border rounded min-h-[100px]"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-6">
                                    <button onClick={handleUpdatePSV} className="flex-1 bg-blue-600 text-white py-2 rounded">Guardar</button>
                                    <button onClick={() => setShowEditPSV(false)} className="flex-1 bg-gray-500 text-white py-2 rounded">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showDetailsModal && selectedPSV && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-all">
                            <div className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-white'} border rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all scale-100`}>
                                {/* Header del Detail */}
                                <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-6">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <p className="text-blue-100 text-sm font-medium uppercase tracking-wider">Detalles de la Válvula</p>
                                            <h2 className="text-3xl font-bold text-white mt-1">{selectedPSV.tag}</h2>
                                        </div>
                                        <button
                                            onClick={() => setShowDetailsModal(false)}
                                            className="bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors"
                                        >
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                {/* Contenido */}
                                <div className="p-8">
                                    <div className="grid grid-cols-2 gap-y-6 gap-x-8">
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Área / Unidad</p>
                                            <p className={`text-lg font-semibold mt-1 ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{selectedPSV.area}</p>
                                        </div>
                                        <div>
                                            <p className={`text-xs uppercase tracking-widest font-bold ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Estado Actual</p>
                                            <div className="mt-1">
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase ${selectedPSV.estado === 'Habilitada' ? 'bg-green-100 text-green-700' :
                                                    selectedPSV.estado === 'Bloqueada' ? 'bg-red-100 text-red-700' :
                                                        'bg-yellow-100 text-yellow-700'
                                                    }`}>
                                                    {selectedPSV.estado}
                                                </span>
                                            </div>
                                        </div>
